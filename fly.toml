# fly.toml — ZAI QUAD FRAMEWORK cloud server config
# Generated for Fly.io deployment

app = "zai-quad-framework"  # CHANGE THIS to your unique app name (lowercase, hyphens only)
primary_region = "sin"      # Singapore — closest to Manila, lowest latency to PH

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # Keep running 24/7 — don't auto-sleep
  auto_start_machines = true
  min_machines_running = 1     # Always have at least 1 machine running

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
